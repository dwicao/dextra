# === SETTING DASAR (TERMUX) ===
# Batasi memori maksimal 2GB agar tidak melebihi kapasitas RAM HP
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Gunakan aapt2 dari Termux untuk menghindari error binary yang salah
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# === OPTIMASI INTI ===
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# === CATATAN PENYESUAIAN TERMUX ===
# Fitur VFS Watch tidak didukung penuh di Termux, sebaiknya di-nonaktifkan
# org.gradle.vfs.watch=true

# Configuration Cache bisa dicoba tapi terkadang bermasalah di proyek besar, bisa di-comment jika error
# org.gradle.configuration-cache=true