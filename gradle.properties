# === SETTING DASAR (WAJIB) ===
# Tambah MaxMetaspaceSize & UseParallelGC biar heap dan GC lebih efisien
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# === OPTIMASI INTI (SUDAH KAMU PAKAI, STABIL) ===
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# === TAMBAHAN OPTIMASI JITU (BARU) ===
# VFS Watch: Deteksi perubahan file lebih cepat (jangan lupa restart IDE/daemon)
org.gradle.vfs.watch=true

# Configuration Cache: Mempercepat build kedua dst (WAJIB Gradle 7.4+. Kalau error, comment baris ini)
org.gradle.configuration-cache=true

# === KOTLIN DAEMON (PISAHKAN MEMORI) ===
# Beri memori khusus untuk compiler Kotlin, jangan rebutan dengan Gradle
kotlin.daemon.jvmargs=-Xmx2g

# === KONFIGURASI OPSIONAL (DIKOMENTARI DULU) ===
# Hardcode worker maksimal. Biarkan Gradle yang atur otomatis kalau ragu.
# org.gradle.workers.max=4

# Rawan error di proyek kompleks. Biarkan Gradle modern yang mengatur.
# org.gradle.configureondemand=true

# Kosmetik saja, tidak mempengaruhi kecepatan.
# org.gradle.internal.launcher.welcomeMessageDisplayed=false